assets:
- BTC
- ETH
- SOL
- HYPE
- BNB
- XRP
- DOGE
capacity:
  estimated_row_bytes_uncompressed: 2500
  parquet_compression_ratio: 0.25
chainlink:
  enable_binance_fallback: false
  max_resolution_wait_seconds: 120
  settlement_source_preference: on_chain_confirmed
  ws_url: wss://ws-live-data.polymarket.com
clock:
  clock_issue_threshold_ms: 50
  ntp_check_interval_seconds: 60
  ntp_server: pool.ntp.org
cursor_store:
  flush_interval_seconds: 5
  mode: per_asset
  path: ./data/cursor_state
depth_thresholds_cents:
- 1
- 5
- 10
discovery_backoff_max_seconds: 8
discovery_poll_interval_seconds: 2
event_thresholds:
  crossing_threshold: 0.0
  depth_change_threshold_pct: 0.15
  size_change_threshold_pct: 0.1
  spread_change_threshold: 0.002
kaggle:
  dataset_prefix: gghgg1/polymarket-5m-crypto
  # one dataset per timeframe lane (plan.md §1.1 confirmed slugs)
  rolling_window: true
  # leeway kept locally after a VERIFIED upload before deletion
  local_retention_hours: 48
  test_upload_interval_seconds: 600
  upload_interval_seconds: 3600
l2_levels: 10
liquidity_filter:
  enabled: false
  min_liquidity: 1000
  min_spread_liquidity_check: false
  min_volume: 500
max_coverage_gap_seconds: 5
raw_archive:
  # BOX-FIT 2026-09-07 (9.7G disk): disabled — raw WS frames grow ~1.8GB/h and
  # filled the disk to 92% within 25 min of 3-lane prod. Diagnostic only; no
  # dataset depends on it. Re-enable on a >=25GB box (RUNBOOK spec).
  enabled: false
  format: jsonl
  path: ./data/raw_ws_archive
  retention_hours: 36
rollover_lead_seconds: 120
schema_version: 3.2.0
series_ids:
  BNB: BNB-5MIN
  BTC: BTC-5MIN
  DOGE: DOGE-5MIN
  ETH: ETH-5MIN
  HYPE: HYPE-5MIN
  SOL: SOL-5MIN
  XRP: XRP-5MIN
snapshot_interval_ms: 500
storage:
  buffer_max_rows: 50000
  compaction_schedule: daily
  compaction_temp_suffix: .tmp
  data_dir: ./data
  disk_space_check_interval_seconds: 30
  disk_space_min_bytes: 1073741824
  flush_interval_seconds: 30
  flush_row_count_threshold: 1500
  wal_dir: ./data/_wal
  wal_enabled: true
synthetic_mode: false
test_mode:
  enabled: false
  num_markets: 4
  window_size_seconds: 300
watchdog:
  alert_on:
  - ws_disconnected
  - resync_failed
  - coverage_gap
  - rollover_miss
  - backpressure
  - write_failed
  - clock_issue
  - resolution_stuck
  - book_anomaly
  - kaggle_upload_failed
  daily_summary_hour_utc: 0
  heartbeat_interval_seconds: 5
  heartbeat_stale_seconds: 15
window_size_seconds: 300
# Multi-timeframe lanes. ONLY enable after verify-gate --probe-timeframes
# reports ENABLE for a lane (probed 2026-09-06: 5m/15m/4h live on all 7 assets;
# 1h found 2026-09-08 under the ET slug family, NOT the unix-ts scheme).
timeframes:
  # ROLLOUT STEP 2 2026-09-08: 5m+15m (14 lanes). P0 leak fixed+verified flat
  # (5aa2feb, VPS probe 3849fd9); raw_ws_archive purged (was 894M stale).
  # 15m validated end-to-end by Task 4 live run. 1h code-ready (ET slugs,
  # live-validated discovery) but OFF until disk fits 3 lanes; 4h same.
  # 1d up/down does not exist on Gamma (daily product is the price-touch
  # ladder, a different market type) — keep OFF.
  - 5m
  - 15m
  # - 1h
  # - 4h

ws:
  full_book_diff_interval_seconds: 300
  full_book_diff_tolerance: 0.01
  max_resync_duration_seconds: 60
  reconnect_backoff_initial_ms: 500
  reconnect_backoff_max_ms: 30000
  reconnect_jitter: true
  rest_book_url: https://clob.polymarket.com/book
  rest_market_url: https://clob.polymarket.com/markets
  resync_rest_backoff_initial_ms: 1000
  resync_rest_backoff_max_ms: 20000
  sequence_gap_detection: true
  url: wss://ws-subscriptions-clob.polymarket.com/ws/market
