[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-collector"
version = "3.0.0"
description = "BTC/ETH/SOL 5-minute up/down market data collector for Polymarket (PLAN.md v3)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "polymarket-collector" }]
keywords = ["polymarket", "orderbook", "trading", "data-collection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pyarrow>=14.0",
  "pandas>=2.0",
  "httpx>=0.25",
  "websockets>=12.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "python-dateutil>=2.8",
  "structlog>=24.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "ruff>=0.2",
  "mypy>=1.8",
]
chaos = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
kaggle = [
  "kaggle>=1.0",
]

[project.urls]
Repository = "https://github.com/example/polymarket-collector"
Issues = "https://github.com/example/polymarket-collector/issues"

[project.scripts]
polymarket-collector = "polymarket_collector.cli:main"
polymarket-watchdog = "polymarket_collector.watchdog.cli:main"
polymarket-compact = "polymarket_collector.storage.compaction:main"
polymarket-export = "polymarket_collector.storage.export:main"
polymarket-capacity = "polymarket_collector.capacity:main"
polymarket-verify-gate = "polymarket_collector.verify_gate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/polymarket_collector"]
branch = true
